<section class="banner">
    <img id="slide" src="img/imagem1.jpg" alt="Banner Olympia">
</section>
<script>
    let imagens = [
        "img/imagem1.jpg",
        "img/imagem2.jpg",
        "img/imagem3.jpg",
    ];
    let index = 0;
    let slide = document.getElementById("slide");
    function trocarImagem() {
        index++;
        if (index >= imagens.length) { index = 0; }
        slide.style.opacity = 0;
        setTimeout(() => { slide.src = imagens[index]; slide.style.opacity = 1; }, 500);
    }
    setInterval(trocarImagem, 5000);

    const token = localStorage.getItem('olympia_token');
    const user = JSON.parse(localStorage.getItem('olympia_user') || 'null');
    if (token && user) {
        document.getElementById('nav-auth').innerHTML = `
            <a href="pages/pedidos.html">Meus Pedidos</a>
            ${user.role === 'ROLE_ADMIN' ? '<a href="pages/admin.html">Admin</a>' : ''}
            <a href="#" onclick="logout()">Sair</a>
        `;
    }
    function logout() {
        localStorage.removeItem('olympia_token');
        localStorage.removeItem('olympia_user');
        location.reload();
    }
</script>
