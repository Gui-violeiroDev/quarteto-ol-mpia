# ========================================
# QUARTETO OLYMPIA - Configurações
# ========================================

# Servidor
server.port=8080

# Banco de Dados MySQL (XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/quarteto_olympia?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
olympia.jwt.secret=OlympiaQuartetoSecretKeyMuitoSegura2026ParaJWTToken
olympia.jwt.expiration=86400000

# Email (Gmail SMTP - configure com seu email)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=guilherme.violista@gmail.com
spring.mail.password=COLE_AQUI_A_SENHA_DE_APP_16_DIGITOS
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Email admin - quem recebe as notificações
olympia.admin.email=guilherme.violista@gmail.com

# SpringDoc / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Logs
logging.level.com.olympia=DEBUG
logging.level.org.hibernate.SQL=DEBUG
