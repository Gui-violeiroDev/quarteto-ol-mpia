<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Login - Quarteto Olympia</title>
</head>
<body>
<header>
    <nav>
        <a href="../index.html">Olympia</a>
        <a href="biografia.html">Biografia</a>
        <a href="galeria.html">Galeria</a>
        <a href="orcamento.html">Orçamento</a>
    </nav>
    <br>
    <figure>
        <img src="../img/logo.png" alt="Logo">
    </figure>
</header>

<br>
<section class="conteudo">
    <h1>Acesso ao Sistema</h1>
    <br>
    <div id="alerta"></div>

    <!-- TABS -->
    <div style="display:flex; gap:10px; margin-bottom:20px;">
        <button class="btn" id="tab-login" onclick="mostrarTab('login')">Entrar</button>
        <button class="btn" style="background:#aaa;" id="tab-cadastro" onclick="mostrarTab('cadastro')">Cadastrar</button>
    </div>

    <!-- LOGIN -->
    <div id="form-login" class="formulario">
        <h2>Login</h2><br>
        <div class="form-group">
            <label>Email <span class="required">*</span></label>
            <input type="email" id="login-email" placeholder="seu@email.com">
        </div>
        <div class="form-group">
            <label>Senha <span class="required">*</span></label>
            <input type="password" id="login-senha" placeholder="Mínimo 6 caracteres">
        </div>
        <button class="btn btn-block" onclick="fazerLogin()">ENTRAR</button>
        <br><br>
        <p style="font-size:0.85rem; color:#888; text-align:center;">
            Admin: admin@olympia.com / admin123<br>
            Teste: guilherme@olympia.com / senha123
        </p>
    </div>

    <!-- CADASTRO -->
    <div id="form-cadastro" class="formulario" style="display:none;">
        <h2>Criar Conta</h2><br>
        <div class="form-row">
            <div class="form-group">
                <label>Nome Completo <span class="required">*</span></label>
                <input type="text" id="cad-nome" placeholder="Seu nome completo">
            </div>
            <div class="form-group">
                <label>Email <span class="required">*</span></label>
                <input type="email" id="cad-email" placeholder="seu@email.com">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Senha <span class="required">*</span></label>
                <input type="password" id="cad-senha" placeholder="Mínimo 6 caracteres">
            </div>
            <div class="form-group">
                <label>Telefone</label>
                <input type="text" id="cad-telefone" placeholder="(11) 91234-5678">
            </div>
        </div>
        <button class="btn btn-block" onclick="fazerCadastro()">CADASTRAR</button>
    </div>
</section>

<footer>
    <br><h3>Quarteto Olympia</h3>
    <p>quartetolympia@hotmail.com</p>
    <p>WhatsApp: (11) 95355-0550</p><br><br>
</footer>

<script src="../js/api.js"></script>
<script>
    if (isLogado()) window.location.href = 'pedidos.html';

    function mostrarTab(tab) {
        document.getElementById('form-login').style.display    = tab === 'login'    ? 'block' : 'none';
        document.getElementById('form-cadastro').style.display = tab === 'cadastro' ? 'block' : 'none';
        document.getElementById('tab-login').style.background    = tab === 'login'    ? '' : '#aaa';
        document.getElementById('tab-cadastro').style.background = tab === 'cadastro' ? '' : '#aaa';
    }

    async function fazerLogin() {
        const email = document.getElementById('login-email').value.trim();
        const senha = document.getElementById('login-senha').value;
        if (!email || !senha) { mostrarAlerta(document.getElementById('alerta'), 'Preencha email e senha.', 'error'); return; }
        try {
            const user = await Auth.login(email, senha);
            mostrarAlerta(document.getElementById('alerta'), `Bem-vindo, ${user.nome}!`, 'success');
            setTimeout(() => {
                window.location.href = user.role === 'ROLE_ADMIN' ? 'admin.html' : 'pedidos.html';
            }, 1000);
        } catch(e) {
            mostrarAlerta(document.getElementById('alerta'), e.message, 'error');
        }
    }

    async function fazerCadastro() {
        const nome  = document.getElementById('cad-nome').value.trim();
        const email = document.getElementById('cad-email').value.trim();
        const senha = document.getElementById('cad-senha').value;
        const tel   = document.getElementById('cad-telefone').value.trim();
        if (!nome || !email || !senha) { mostrarAlerta(document.getElementById('alerta'), 'Preencha os campos obrigatórios.', 'error'); return; }
        try {
            await Auth.cadastrar({ nome, email, senha, telefone: tel });
            mostrarAlerta(document.getElementById('alerta'), 'Conta criada! Redirecionando...', 'success');
            setTimeout(() => window.location.href = 'pedidos.html', 1200);
        } catch(e) {
            mostrarAlerta(document.getElementById('alerta'), e.message, 'error');
        }
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') fazerLogin(); });
</script>
</body>
</html>
